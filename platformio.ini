; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:nucleo_f303re]
platform = ststm32
board = nucleo_f303re
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
extra_scripts = pre:hardfloat.py
build_src_filter = +<*> +<../shared/*>
build_flags =
	-DCFG_TUSB_MCU=OPT_MCU_STM32F3
	-DFW_VERSION=1
	-D_RETARGET_LOCKING
	-D__PLATFORMIO__
	-I Inc
	-I Src
	-I Src/Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
	-I Src/Middlewares/Third_Party/FreeRTOS/Source/include
	-I Src/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
	-I shared
	-O2
	-DFOC_LIB_USE_CONF
	-Wl,-u,_printf_float
; PlatformIO's release default is -Os; remove it so -O2 is the only level
; (foc_lib at -Os: Park 77 vs 47 cycles, SMO_Update 405 vs 341). Never add -ffast-math.
build_unflags = -Os

; Serial console: USART2 via ST-Link VCP, 230400 bps 8N1
monitor_speed = 230400
; The COM number can change if the board is re-plugged (check: pio device list)
monitor_port = COM5

[platformio]
include_dir = Inc
src_dir = Src
